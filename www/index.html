<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Expense</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a16">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #070714;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.12);
            --neon-blue: #00f2fe;
            --neon-purple: #9b51e0;
            --neon-pink: #ff2a85;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); background-image: radial-gradient(circle at 10% 20%, rgba(155, 81, 224, 0.25) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.2) 0%, transparent 40%); background-attachment: fixed; color: var(--text-main); min-height: 100vh; padding-bottom: 50px; overflow-x: hidden; }
        
        /* Lock Screen Style */
        #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: var(--bg-color); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.4s ease; }
        .lock-icon { font-size: 50px; margin-bottom: 20px; filter: drop-shadow(0 0 10px var(--neon-blue)); }
        .pin-input { width: 200px; text-align: center; font-size: 24px; letter-spacing: 10px; padding: 15px; border-radius: 20px; background: rgba(255,255,255,0.1); border: 1px solid var(--neon-blue); color: white; margin-bottom: 20px; outline: none; }
        .pin-btn { padding: 15px 40px; border-radius: 20px; border: none; background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); color: black; font-weight: bold; font-size: 16px; cursor: pointer; }
        .forgot-pin { margin-top: 25px; font-size: 12px; color: var(--text-muted); text-decoration: underline; cursor: pointer; }

        .container { max-width: 450px; margin: 0 auto; padding: 20px 16px; display: none; }
        .glass-card { background: var(--card-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--card-border); border-radius: 28px; padding: 22px; margin-bottom: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); animation: fadeIn 0.6s ease-out; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .header h1 { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, #fff, var(--neon-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink)); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; box-shadow: 0 0 15px rgba(255, 42, 133, 0.4); }
        .balance-card { background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02)); position: relative; overflow: hidden; }
        .balance-card::before { content: ''; position: absolute; top: -50px; right: -50px; width: 120px; height: 120px; background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); filter: blur(50px); opacity: 0.6; }
        .balance-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600;}
        .balance-amount { font-size: 38px; font-weight: 800; margin: 8px 0 16px 0; letter-spacing: -0.5px; }
        .budget-stats { display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px; }
        .stat-item p { font-size: 13px; color: var(--text-muted); font-weight: 500;}
        .stat-item h3 { font-size: 18px; font-weight: 700; margin-top: 2px; }
        .chart-box { position: relative; height: 200px; display: flex; justify-content: center; align-items: center; }
        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
        input, select { width: 100%; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.15); padding: 14px 18px; border-radius: 16px; color: #fff; font-size: 15px; outline: none; transition: all 0.3s; }
        input:focus, select:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); background: rgba(255, 255, 255, 0.1); }
        select option { background: #0f1026; color: #fff; }
        .btn-add { width: 100%; padding: 16px; border: none; border-radius: 18px; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #9b51e0 100%); color: #050510; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 25px rgba(0, 242, 254, 0.35); transition: transform 0.2s, box-shadow 0.2s; margin-top: 10px; }
        .btn-add:active { transform: scale(0.97); box-shadow: 0 5px 15px rgba(0, 242, 254, 0.2); }
        .btn-backup { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; box-shadow: none; font-size: 14px; }
        .list-header { font-size: 16px; font-weight: 700; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .tx-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); animation: slideIn 0.3s ease; }
        .tx-left { display: flex; align-items: center; gap: 14px; }
        .tx-icon { width: 44px; height: 44px; border-radius: 14px; background: rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .tx-title { font-size: 15px; font-weight: 600; }
        .tx-date { font-size: 12px; color: var(--text-muted); }
        .tx-amount { font-size: 16px; font-weight: 700; color: var(--neon-pink); }
        .btn-del { background: none; border: none; color: rgba(255, 255, 255, 0.3); font-size: 22px; margin-left: 10px; cursor: pointer; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: translateX(0); } }
        .backup-container { display: flex; gap: 10px; }

        /* Voice Assistant Button */
        .voice-btn { position: fixed; bottom: 30px; right: 20px; width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple)); border: none; font-size: 28px; color: white; box-shadow: 0 0 20px rgba(255, 42, 133, 0.6); cursor: pointer; z-index: 100; display: flex; justify-content: center; align-items: center; transition: all 0.3s; }
        .voice-btn.recording { animation: pulse 1s infinite; background: linear-gradient(135deg, #ff0000, var(--neon-pink)); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 42, 133, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 42, 133, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 42, 133, 0); } }
    </style>
</head>
<body>

    <!-- Lock Screen -->
    <div id="lockScreen">
        <div class="lock-icon" id="lockIcon">🔒</div>
        <h2 id="lockTitle" style="margin-bottom: 20px; font-weight: 700;">अपना 4-अंकों का PIN डालें</h2>
        <input type="password" id="pinInput" class="pin-input" maxlength="4" inputmode="numeric" placeholder="****">
        <button class="pin-btn" onclick="handleLogin()" id="pinBtn">Unlock</button>
        <div class="forgot-pin" onclick="resetApp()">PIN भूल गए? (Reset App)</div>
    </div>

    <!-- Main App -->
    <div class="container" id="mainApp">
        <div class="header">
            <div>
                <p style="font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom:2px;">स्वागत है</p>
                <h1>स्मार्ट खर्चा</h1>
            </div>
            <div class="avatar">₹</div>
        </div>

        <div class="glass-card balance-card">
            <div class="balance-title">बची हुई राशि</div>
            <div class="balance-amount" id="remainingBalance">₹0</div>
            <div class="budget-stats">
                <div class="stat-item">
                    <p>कुल बजट</p>
                    <h3 id="budgetDisplay" onclick="changeBudget()" style="cursor: pointer; color: var(--neon-blue);">₹0 ✎</h3>
                </div>
                <div class="stat-item" style="text-align: right;">
                    <p>कुल खर्च</p>
                    <h3 id="totalExpense" style="color: var(--neon-pink);">₹0</h3>
                </div>
            </div>
        </div>

        <div class="glass-card">
            <h3 style="font-size: 15px; font-weight: 700; margin-bottom: 10px; color: var(--text-muted);">खर्च का ग्राफ</h3>
            <div class="chart-box"><canvas id="expenseChart"></canvas></div>
        </div>

        <div class="glass-card">
            <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 16px;">+ नया खर्च जोड़ें</h3>
            <div class="input-group">
                <label>राशि (₹)</label>
                <input type="number" id="amount" placeholder="जैसे: 250" inputmode="numeric">
            </div>
            <div class="input-group">
                <label>श्रेणी (किस चीज़ पर खर्च हुआ?)</label>
                <select id="category">
                    <option value="Food">🍔 खाना / चाय-नाश्ता</option>
                    <option value="Travel">🚗 पेट्रोल / ऑटो / सफ़र</option>
                    <option value="Shopping">🛍️ खरीदारी / कपड़े</option>
                    <option value="Bills">⚡ रिचार्ज / बिल</option>
                    <option value="Entertainment">🎬 मूवीज़ / मस्ती</option>
                    <option value="Other">💡 अन्य (Other)</option>
                </select>
            </div>
            <div class="input-group">
                <label>विवरण (कहाँ खर्च किया?)</label>
                <input type="text" id="note" placeholder="जैसे: दुकान या दोस्तों के साथ">
            </div>
            <button class="btn-add" onclick="addExpense()">खर्च जोड़ें</button>
        </div>

        <div class="glass-card">
            <h3 style="font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--text-muted);">डेटा सुरक्षा (बैकअप)</h3>
            <div class="backup-container">
                <button class="btn-add btn-backup" onclick="backupData()">📤 बैकअप (सेव करें)</button>
                <button class="btn-add btn-backup" onclick="restoreData()">📥 रिस्टोर करें</button>
            </div>
            <p style="font-size: 11px; color: var(--text-muted); margin-top: 8px; text-align: center;">ऐप अपडेट या अनइंस्टॉल से पहले बैकअप ले लें।</p>
        </div>

        <div class="glass-card">
            <div class="list-header">
                <span>हाल का खर्च</span>
                <span id="txCount" style="font-size: 12px; color: var(--text-muted); font-weight: 500;">0 प्रविष्टियाँ</span>
            </div>
            <div id="expenseList"></div>
        </div>
    </div>

    <!-- Voice Assistant Button -->
    <button class="voice-btn" id="voiceBtn" onclick="startVoice()">🎤</button>

    <script>
        // --- LOGIN LOGIC ---
        let savedPin = localStorage.getItem('app_pin');
        let pinAttempts = 0;

        function checkPinSetup() {
            let lockTitle = document.getElementById('lockTitle');
            let pinBtn = document.getElementById('pinBtn');
            let lockIcon = document.getElementById('lockIcon');
            let pinInput = document.getElementById('pinInput');
            
            if (!savedPin) {
                lockTitle.innerText = "नया PIN सेट करें (4 अंक)";
                pinBtn.innerText = "Set PIN";
                lockIcon.innerText = "🛡️";
            }
        }

        function handleLogin() {
            let pin = document.getElementById('pinInput').value;
            if (pin.length !== 4) { alert("कृपया 4 अंकों का PIN डालें!"); return; }

            if (!savedPin) {
                // Set new pin
                localStorage.setItem('app_pin', pin);
                alert("✅ PIN सेट हो गया! अब आप ऐप इस्तेमाल कर सकते हैं।");
                unlockApp();
            } else {
                // Check pin
                if (pin === savedPin) {
                    unlockApp();
                } else {
                    pinAttempts++;
                    alert("❌ गलत PIN! कोशिश करें: " + pinAttempts);
                    document.getElementById('pinInput').value = '';
                }
            }
        }

        function unlockApp() {
            document.getElementById('lockScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
            }, 400);
        }

        function resetApp() {
            let confirmReset = prompt("यह आपका सारा डेटा डिलीट कर देगा! सुनिश्चित करने के लिए 'RESET' टाइप करें:");
            if (confirmReset === 'RESET') {
                localStorage.clear();
                location.reload();
            }
        }

        // --- VOICE ASSISTANT LOGIC ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN'; // Hindi language
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = function(event) {
                let transcript = event.results[0][0].transcript;
                processVoiceText(transcript);
            };

            recognition.onerror = function(event) {
                alert("आवाज़ पहचानने में त्रुटि: " + event.error);
                stopRecording();
            };

            recognition.onend = function() {
                stopRecording();
            };
        }

        function startVoice() {
            if (!recognition) {
                alert("आपका फ़ोन या ब्राउज़र वॉइस असिस्टेंट सपोर्ट नहीं करता।");
                return;
            }
            if (isRecording) {
                recognition.stop();
                return;
            }
            isRecording = true;
            document.getElementById('voiceBtn').classList.add('recording');
            document.getElementById('voiceBtn').innerText = "⏹️";
            recognition.start();
            
            // Show text that we are listening
            document.getElementById('note').placeholder = "सुन रहा हूँ...";
        }

        function stopRecording() {
            isRecording = false;
            document.getElementById('voiceBtn').classList.remove('recording');
            document.getElementById('voiceBtn').innerText = "🎤";
            document.getElementById('note').placeholder = "जैसे: दुकान या दोस्तों के साथ";
        }

        function processVoiceText(text) {
            // Convert Hindi numbers to digits (e.g., "bees" -> 20)
            const hindiNumbers = { 'एक': 1, 'दो': 2, 'तीन': 3, 'चार': 4, 'पांच': 5, 'छह': 6, 'सात': 7, 'आठ': 8, 'नौ': 9, 'दस': 10, 'बीस': 20, 'तीस': 30, 'चालीस': 40, 'पचास': 50, 'सौ': 100, 'हज़ार': 1000 };
            let processedText = text.toLowerCase();
            
            for (let [word, num] of Object.entries(hindiNumbers)) {
                processedText = processedText.replace(word, num);
            }

            // Extract Numbers (Amount)
            let amountMatch = processedText.match(/\d+/);
            let amount = amountMatch ? parseInt(amountMatch[0]) : null;

            // Determine Category based on keywords
            let category = "Other";
            let foodWords = ['खाना', 'खाया', 'चाय', 'समोसा', 'वड़ा', 'पाव', 'भोजन', 'lunch', 'dinner', 'swiggy', 'zomato'];
            let travelWords = ['ऑटो', 'रिक्शा', 'पेट्रोल', 'बस', 'ट्रेन', 'कैब', 'travel', 'ola', 'uber'];
            let shopWords = ['कपड़े', 'शर्ट', 'पैंट', 'जूते', 'खरीदारी', 'shopping', 'amazon', 'flipkart'];
            let billWords = ['रिचार्ज', 'बिल', 'बिजली', 'गैस', 'इंटरनेट', 'wifi', 'recharge'];

            if (foodWords.some(w => processedText.includes(w))) category = "Food";
            else if (travelWords.some(w => processedText.includes(w))) category = "Travel";
            else if (shopWords.some(w => processedText.includes(w))) category = "Shopping";
            else if (billWords.some(w => processedText.includes(w))) category = "Bills";
            else if (processedText.includes('मूवी') || processedText.includes('movie')) category = "Entertainment";

            if (amount) {
                document.getElementById('amount').value = amount;
                document.getElementById('category').value = category;
                document.getElementById('note').value = text; // Original text as note

                // Auto Add
                addExpense();
                alert(`✅ सफलतापूर्वक जोड़ा गया:\nराशि: ₹${amount}\nश्रेणी: ${category}\nविवरण: ${text}`);
            } else {
                alert("❌ माफ़ कीजिए, मैं राशि (Amount) नहीं समझ पाया। कृपया दोबारा बोलें, जैसे: 'मैंने 50 रुपये की चाय पी'");
            }
        }

        // --- APP MAIN LOGIC ---
        let budget = localStorage.getItem('budget') ? parseFloat(localStorage.getItem('budget')) : 15000;
        let expenses = localStorage.getItem('expenses') ? JSON.parse(localStorage.getItem('expenses')) : [];
        const categoryIcons = { Food: '🍔', Travel: '🚗', Shopping: '🛍️', Bills: '⚡', Entertainment: '🎬', Other: '💡' };

        let ctx = document.getElementById('expenseChart').getContext('2d');
        let expenseChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['खाना', 'सफ़र', 'खरीदारी', 'बिल', 'मस्ती', 'अन्य'], datasets: [{ data: [0, 0, 0, 0, 0, 0], backgroundColor: ['#ff4757', '#00f2fe', '#a855f7', '#ffa502', '#ff2a85', '#2ed573'], borderWidth: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#ffffff', boxWidth: 10, font: { size: 10, family: 'Plus Jakarta Sans' } } } }, cutout: '70%' }
        });

        function changeBudget() {
            let newBudget = prompt("अपना नया मासिक बजट सेट करें (₹):", budget);
            if (newBudget !== null && !isNaN(newBudget) && newBudget > 0) {
                budget = parseFloat(newBudget);
                localStorage.setItem('budget', budget);
                updateUI();
            }
        }

        function addExpense() {
            let amount = parseFloat(document.getElementById('amount').value);
            let category = document.getElementById('category').value;
            let note = document.getElementById('note').value.trim() || category;
            if (isNaN(amount) || amount <= 0) { alert("कृपया सही राशि डालें!"); return; }
            
            let newTx = { id: Date.now(), amount: amount, category: category, note: note, date: new Date().toLocaleDateString('hi-IN', { day: 'numeric', month: 'short' }) };
            expenses.unshift(newTx);
            localStorage.setItem('expenses', JSON.stringify(expenses));
            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
            updateUI();
        }

        function deleteExpense(id) {
            expenses = expenses.filter(item => item.id !== id);
            localStorage.setItem('expenses', JSON.stringify(expenses));
            updateUI();
        }

        function updateUI() {
            let total = expenses.reduce((sum, item) => sum + item.amount, 0);
            let remaining = budget - total;
            document.getElementById('budgetDisplay').innerText = `₹${budget.toLocaleString('en-IN')} ✎`;
            document.getElementById('totalExpense').innerText = `₹${total.toLocaleString('en-IN')}`;
            let remEl = document.getElementById('remainingBalance');
            remEl.innerText = `₹${remaining.toLocaleString('en-IN')}`;
            remEl.style.color = remaining < 0 ? '#ff4757' : '#ffffff';
            
            document.getElementById('txCount').innerText = `${expenses.length} प्रविष्टियाँ`;
            let listEl = document.getElementById('expenseList');
            listEl.innerHTML = '';
            if (expenses.length === 0) listEl.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px 0;">अभी कोई खर्च नहीं जोड़ा गया।</p>`;
            
            expenses.forEach(item => {
                let div = document.createElement('div');
                div.className = 'tx-item';
                div.innerHTML = `
                    <div class="tx-left">
                        <div class="tx-icon">${categoryIcons[item.category] || '💡'}</div>
                        <div>
                            <div class="tx-title">${item.note}</div>
                            <div class="tx-date">${item.date} • ${item.category}</div>
                        </div>
                    </div>
                    <div style="display: flex; align-items: center;">
                        <span class="tx-amount">-₹${item.amount.toLocaleString('en-IN')}</span>
                        <button class="btn-del" onclick="deleteExpense(${item.id})">×</button>
                    </div>`;
                listEl.appendChild(div);
            });
            
            let catTotals = { Food: 0, Travel: 0, Shopping: 0, Bills: 0, Entertainment: 0, Other: 0 };
            expenses.forEach(i => { if (catTotals[i.category] !== undefined) catTotals[i.category] += i.amount; });
            expenseChart.data.datasets[0].data = Object.values(catTotals);
            expenseChart.update();
        }

        function backupData() {
            let dataStr = JSON.stringify({ budget: budget, expenses: expenses });
            let encodedData = btoa(dataStr);
            navigator.clipboard.writeText(encodedData).then(() => {
                alert("✅ डेटा कॉपी हो गया है!\n\nइसे अपने WhatsApp (खुद को) या Notes में सेव कर लें।");
            }).catch(err => {
                prompt("कॉपी नहीं हो पाया, इस टेक्स्ट को कॉपी करें:", encodedData);
            });
        }

        function restoreData() {
            let input = prompt("अपना बैकअप कोड यहाँ पेस्ट करें:");
            if (!input) return;
            try {
                let decodedStr = atob(input);
                let data = JSON.parse(decodedStr);
                if (data.budget !== undefined && data.expenses !== undefined) {
                    localStorage.setItem('budget', data.budget);
                    localStorage.setItem('expenses', JSON.stringify(data.expenses));
                    alert("🎉 डेटा रिस्टोर हो गया! ऐप रीस्टार्ट हो रहा है...");
                    location.reload();
                } else {
                    alert("❌ गलत कोड! कृपया सही बैकअप पेस्ट करें।");
                }
            } catch (e) {
                alert("❌ अमान्य कोड! कृपया जाँचें कि पूरा टेक्स्ट कॉपी किया है।");
            }
        }

        // Init
        checkPinSetup();
        updateUI();
    </script>
</body>
</html>
