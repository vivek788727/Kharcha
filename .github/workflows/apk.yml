name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm install

      - run: npx cap add android

      - run: npx cap sync android

      - name: Add microphone permission
        run: |
          python3 - << 'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t = p.read_text()
          if "RECORD_AUDIO" not in t:
              add = '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    '
              t = t.replace("<application", add + "<application")
              p.write_text(t)
          print("Manifest OK")
          PY

      - name: Restore permanent signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && printf "%s" "$KS" | base64 --decode > ~/.android/debug.keystore && echo "Permanent key restored"; else echo "No secret, using default key"; fi

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Kharcha-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
